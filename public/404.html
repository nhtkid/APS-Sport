<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // GitHub Pages SPA redirect: store the intended path then redirect to root
      var path = window.location.pathname;
      var base = '/APS-Sport';
      if (path.startsWith(base)) {
        path = path.slice(base.length) || '/';
      }
      sessionStorage.redirect = window.location.origin + base + path + window.location.search + window.location.hash;
      window.location.replace(window.location.origin + base + '/');
    </script>
  </head>
  <body></body>
</html>
